[package]
name = "zero-g-agy-quota"
version.workspace = true
edition = "2024"
description = "Pushes the official agy CLI's Antigravity quota and plan to a Zero-G gateway"
license = "MIT OR Apache-2.0"

[[bin]]
name = "zero-g-agy-quota"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "process", "time", "io-util", "macros"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
