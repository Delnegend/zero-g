services:
  zero-g:
    build: .
    image: ghcr.io/delnegend/zero-g:latest
    container_name: zero-g
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - ZERO_G_BIND=0.0.0.0:8080
    volumes:
      - ./credentials.json:/app/credentials.json:ro,Z
