services:
  zero-g:
    build: .
    image: ghcr.io/delnegend/zero-g:latest
    container_name: zero-g
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      ZERO_G_BIND: ${ZERO_G_BIND:-0.0.0.0:8080}
    volumes:
      - zero-g-data:/app/data

volumes:
  zero-g-data:
    name: zero-g-data
