# Toasty's optional MySQL driver is not enabled. Remove this exception when
# toasty-cli stops enabling Toasty's default features.
[[PackageOverrides]]
name = "rsa"
version = "0.10.0-rc.19"
ecosystem = "crates.io"
vulnerability.ignore = true
reason = "Only present through Toasty's disabled MySQL driver; checked by just check-dependencies."

# Review by 2026-11-28. Zero-G verifies OIDC signatures using public keys;
# it does not use this dependency for RSA private-key operations.
[[PackageOverrides]]
name = "rsa"
version = "0.9.10"
ecosystem = "crates.io"
vulnerability.ignore = true
effectiveUntil = 2026-11-28
reason = "RUSTSEC-2023-0071 concerns private-key timing; OIDC verifies public signatures."

# Review by 2026-11-28 if OIDC begins performing secret elliptic-curve arithmetic.
[[PackageOverrides]]
name = "crypto-bigint"
version = "0.5.5"
ecosystem = "crates.io"
vulnerability.ignore = true
effectiveUntil = 2026-11-28
reason = "RUSTSEC-2026-0387 concerns secret integers; OIDC uses public verification keys."

# The shadcn tool uses deepmerge; it is absent from the built dashboard.
[[PackageOverrides]]
name = "deepmerge"
version = "4.3.1"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-28
reason = "GHSA-gcqx-w48m-w2h4 affects shadcn development tooling, not the built dashboard."

# Review by 2026-11-14. This advisory names minimatch 10.2.6 with optimization
# level >= 2. The locked 10.x caller uses the default level 1; 5.x lacks the
# affected preprocessing. Reassess these call paths when dependencies change.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-11-14
reason = "Current minimatch callers do not use the vulnerable preprocessing; 5.x lacks it."
