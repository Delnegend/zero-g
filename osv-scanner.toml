# Toasty's optional MySQL driver is present in the lockfile but not enabled.
# Remove this exception when the locked RSA dependency is fixed or removed.
[[PackageOverrides]]
name = "rsa"
version = "0.10.0-rc.19"
ecosystem = "crates.io"
vulnerability.ignore = true
reason = "Only present through Toasty's disabled MySQL driver; checked by just check-dependencies."

# Review by 2026-11-28. Zero-G verifies OIDC signatures using public keys;
# it does not use this dependency for RSA private-key operations.
[[PackageOverrides]]
name = "rsa"
version = "0.9.10"
ecosystem = "crates.io"
vulnerability.ignore = true
effectiveUntil = 2026-11-28
reason = "RUSTSEC-2023-0071 concerns private-key timing; OIDC verifies public signatures."

# fast-xml-parser is a transitive dependency of ReDoc's openapi-sampler; the
# fixed 5.12.0 release is inside the 14-day supply-chain quarantine window.
[[IgnoredVulns]]
id = "GHSA-474x-hrwr-fgx4"
ignoreUntil = 2026-11-28
reason = "Affected through ReDoc; fixed release remains quarantined until 2026-11-17."
