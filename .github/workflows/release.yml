name: Release / Build Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "zero-g"
          save-if: "false"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install and build frontend
        shell: bash
        run: |
          cd frontend && bun install --frozen-lockfile
          cd .. && just frontend-build

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@46feaa27e7375da0e3d602721e9fb9573598b880 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        uses: Delnegend/actions/resolve-release@main  # nosemgrep
        with:
          ref: ${{ inputs.ref }}
          dry-run: ${{ inputs.dry-run }}
          gate-sha: ${{ github.sha }}
          semver-bump: ${{ steps.semver.outputs.bump }}
          semver-current: ${{ steps.semver.outputs.current }}
          semver-next: ${{ steps.semver.outputs.next }}
          semver-next-strict: ${{ steps.semver.outputs.nextStrict }}

  build-container:
    name: Build Container Image
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
 
      # The shared action cannot omit latest or label the checked-out revision.
      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          RELEASE_REF: ${{ needs.prepare.outputs.ref }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision="$(git rev-parse HEAD)"
          tags="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)"
          latest=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest="$tag"
              break
            fi
          done <<< "$tags"
          if [[ "$PUBLISH" == "true" && -z "$latest" ]]; then
            echo "::error::No version tag found; refusing to publish."
            exit 1
          fi
          {
            echo "image=$image"
            echo "revision=$revision"
            echo "tags<<EOF"
            echo "$image:$VERSION"
            if [[ "$PUBLISH" == "true" && "$RELEASE_REF" == "$latest" ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Compiled Rust dependencies live in the Dockerfile's cache mounts, which
      # the image layer cache does not keep. The key names what they depend
      # on: the lockfile and manifests without Zero-G's own version (bumped
      # every release), the Dockerfile, and the Rust builder image. An exact
      # hit skips copying the mounts back out and saving them again, which is
      # most of the cost; a miss restores the closest entry built with the same
      # image, so a dependency update recompiles only what changed, and a new
      # Rust image starts clean instead of piling up stale artifacts.
      - name: Key Rust build mounts
        id: cargo-key
        shell: bash
        run: |
          set -euo pipefail
          image="$(docker buildx imagetools inspect --raw docker.io/library/rust:1-alpine | sha256sum | cut -c1-12)"
          deps="$(
            {
              awk '/^name = "zero-g(-agy-integration)?"$/ { print; getline; next } { print }' Cargo.lock
              grep -hv '^version = ' Cargo.toml agy-integration/Cargo.toml
              cat Dockerfile
            } | sha256sum | cut -c1-16
          )"
          {
            echo "prefix=docker-cargo-${RUNNER_OS}-${RUNNER_ARCH}-${image}-"
            echo "deps=${deps}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Rust build mounts
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cargo-mounts
          key: ${{ steps.cargo-key.outputs.prefix }}${{ steps.cargo-key.outputs.deps }}
          restore-keys: ${{ steps.cargo-key.outputs.prefix }}

      - name: Load Rust build mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "cargo-mounts/registry": {"target": "/usr/local/cargo/registry", "id": "zero-g-cargo-registry"},
              "cargo-mounts/git": {"target": "/usr/local/cargo/git", "id": "zero-g-cargo-git"},
              "cargo-mounts/target": {"target": "/app/target", "id": "zero-g-target"}
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          load: ${{ needs.prepare.outputs.publish != 'true' }}
          outputs: ${{ needs.prepare.outputs.publish == 'true' && 'type=image,compression=zstd,compression-level=4' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: ${{ needs.prepare.outputs.publish == 'true' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true', steps.meta.outputs.image) || '' }}

  build-agy-integration:
    name: Build agy integration (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install musl linker
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --package zero-g-agy-integration --target "$TARGET"

      - name: Package binary
        uses: Delnegend/actions/package-artifact@main  # nosemgrep
        with:
          name: zero-g-agy-integration
          version: ${{ needs.prepare.outputs.version }}
          target: ${{ matrix.target }}
          source: target/${{ matrix.target }}/release/zero-g-agy-integration
          extra: LICENSE-MIT LICENSE-APACHE

  publish:
    name: Publish Consolidated Release
    needs: [prepare, build-container, build-agy-integration]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: Delnegend/actions/publish-release@main  # nosemgrep
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          publish: ${{ needs.prepare.outputs.publish }}
          container: true
          download: "true"
          version: ${{ needs.prepare.outputs.version }}
