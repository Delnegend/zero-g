[package]
name = "zero-g-agy-integration"
version.workspace = true
edition = "2024"
description = "Reports the official agy CLI's Antigravity quota, plan and usage to a Zero-G gateway"
license = "MIT OR Apache-2.0"

[[bin]]
name = "zero-g-agy-integration"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "process", "time", "io-util", "io-std"] }
libc = "0.2.191"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
