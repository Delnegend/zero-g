[package]
name = "zero-g"
version = "0.4.0"
edition = "2024"
description = "OpenAI-compatible proxy for Google Antigravity subscriptions"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["tokio"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
rand = "0.9.5"
dotenvy = "0.15.7"
sha2 = "0.10.8"
base64 = "0.22.1"

[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
struct_field_names = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"

[profile.release]
lto = "thin"
strip = true
